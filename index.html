<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sami Khan — A cinematic 3D scroll-driven architectural monograph." />
    <title>SAMI KHAN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Italiana&family=Kaisei+Tokumin:wght@700;800&family=Marcellus&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;700&family=Yuji+Boku&family=Yuji+Mai&display=swap" rel="stylesheet" />
    <style>
      /* ── Instant Critical Preloader (Zero Latency GPU Animation) ── */
      body {
        margin: 0;
        background-color: #04070e;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #sanctuary-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #0d1527 0%, #04070e 80%);
        user-select: none;
        will-change: opacity, clip-path;
        transform: translateZ(0);
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), clip-path 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        clip-path: inset(0 0 0 0);
      }
      #sanctuary-preloader.preloader-done {
        opacity: 0;
        clip-path: inset(50% 0 50% 0);
        pointer-events: none;
      }
      .pre-zen-wrap {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        transform: translateZ(0);
      }
      .pre-zen-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        will-change: transform;
        animation: preSpin 1.8s linear infinite;
      }
      @keyframes preSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pre-hanko {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        background: radial-gradient(circle at 35% 30%, #d83a2b 0%, #a11d1d 70%, #680d0d 100%);
        border: 1.5px solid rgba(255, 175, 155, 0.75);
        box-shadow: 0 4px 18px rgba(215, 50, 30, 0.5), inset 0 0 8px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateZ(0);
        will-change: transform;
        animation: prePulse 1.8s infinite ease-in-out;
      }
      @keyframes prePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .pre-hanko-kanji {
        font-family: "Shippori Mincho", "Yu Mincho", Georgia, serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: #fff9f5;
        writing-mode: vertical-rl;
        text-orientation: upright;
        text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        letter-spacing: -0.05em;
      }
      .pre-badge {
        font-size: 0.58rem;
        letter-spacing: 0.28em;
        color: #d8aa58;
        text-transform: uppercase;
        margin-bottom: 8px;
        font-family: monospace;
      }
      .pre-title {
        font-family: 'Cinzel Decorative', Georgia, serif;
        font-size: clamp(1.3rem, 3.2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.24em;
        color: #ffffff;
        text-transform: uppercase;
        margin: 0 0 24px;
        text-shadow: 0 0 24px rgba(255, 255, 255, 0.4);
      }
      .pre-track {
        position: relative;
        width: 160px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        transform: translateZ(0);
      }
      .pre-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, transparent 0%, #d8aa58 50%, #ffe099 75%, transparent 100%);
        border-radius: 3px;
        box-shadow: 0 0 12px rgba(216, 170, 88, 0.9);
        will-change: transform;
        animation: preShimmer 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <!-- Instant Preloader for hard-refresh (Ctrl+Shift+R) -->
    <div id="sanctuary-preloader" aria-label="Loading Sanctuary Archive">
      <div class="pre-zen-wrap">
        <svg class="pre-zen-ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2.5" />
          <circle cx="60" cy="60" r="50" fill="none" stroke="#d8aa58" stroke-width="3" stroke-dasharray="140 180" stroke-linecap="round" />
        </svg>
        <div class="pre-hanko">
          <span class="pre-hanko-kanji">佐美</span>
        </div>
      </div>
      <div class="pre-badge">Kyoto Sanctuary · 2026</div>
      <h1 class="pre-title">SAMI KHAN</h1>
      <div class="pre-track">
        <div class="pre-fill"></div>
      </div>
    </div>
    <script>
      (function() {
        var dismissed = false;
        window.dismissSanctuaryPreloader = function() {
          if (dismissed) return;
          dismissed = true;
          var el = document.getElementById('sanctuary-preloader');
          if (el) {
            el.classList.add('preloader-done');
            setTimeout(function() {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 500);
          }
        };

        // Safety fallback dismissal
        if (document.readyState === 'complete') {
          setTimeout(window.dismissSanctuaryPreloader, 600);
        } else {
          window.addEventListener('load', function() {
            setTimeout(window.dismissSanctuaryPreloader, 500);
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
